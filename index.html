<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FAQ Chatbot</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .chat-container {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    height: 600px;
  }
  .chat-header {
    background: #2563eb;
    color: white;
    padding: 16px;
    border-radius: 12px 12px 0 0;
    font-weight: bold;
    font-size: 18px;
  }
  .chat-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 14px;
  }
  .user {
    align-self: flex-end;
    background: #2563eb;
    color: white;
    border-bottom-right-radius: 2px;
  }
  .bot {
    align-self: flex-start;
    background: #e5e7eb;
    color: #111827;
    border-bottom-left-radius: 2px;
  }
  .chat-input {
    display: flex;
    border-top: 1px solid #eee;
    padding: 10px;
    gap: 8px;
  }
  .chat-input input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
  }
  .chat-input button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .chat-input button:hover {
    background: #1d4ed8;
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">FAQ Chatbot</div>
  <div class="chat-messages" id="messages">
    <div class="msg bot">Hi! Ask me anything about shipping, returns, payments, or orders.</div>
  </div>
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Type your question..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
async function sendMessage() {
  const input = document.getElementById("userInput");
  const messages = document.getElementById("messages");
  const text = input.value.trim();
  if (!text) return;

  messages.innerHTML += `<div class="msg user">${escapeHtml(text)}</div>`;
  input.value = "";
  messages.scrollTop = messages.scrollHeight;

  const res = await fetch("/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text })
  });
  const data = await res.json();

  messages.innerHTML += `<div class="msg bot">${escapeHtml(data.answer)}</div>`;
  messages.scrollTop = messages.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.innerText = str;
  return div.innerHTML;
}
</script>

</body>
</html>
